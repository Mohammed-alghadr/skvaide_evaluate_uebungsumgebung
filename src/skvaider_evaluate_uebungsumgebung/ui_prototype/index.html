<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation UI Prototype</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            background-color: #e5e7eb;
        }
        .status-queued { background-color: #fef3c7; color: #92400e; }
        .status-running { background-color: #dbeafe; color: #1e40af; }
        .status-done { background-color: #d1fae5; color: #065f46; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .metric-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .metric-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #111827;
        }
        .error-msg {
            color: #dc2626;
            margin-top: 10px;
            font-weight: 500;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>LLM Evaluation Prototype</h1>
        <textarea id="promptInput" placeholder="Text oder Prompt zur Evaluierung eingeben..."></textarea>
        <button id="startBtn">Evaluation starten</button>
        <div id="errorBox" class="error-msg hidden"></div>
    </div>

    <div id="resultCard" class="card hidden">
        <div>
            <strong>Evaluation ID:</strong> <span id="evalIdDisplay">-</span>
        </div>
        <div style="margin-top: 8px;">
            <strong>Status:</strong> <span id="statusBadge" class="status-badge">-</span>
        </div>
        <div id="metricsContainer" class="metrics-grid hidden"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
